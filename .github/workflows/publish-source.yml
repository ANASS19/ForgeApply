name: Publish ForgeApply source
on:
  push:
    paths:
      - ".forgeapply-source.tar.xz.base64"
      - ".github/workflows/publish-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgeapply-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Extract and validate full source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .forgeapply-source.tar.xz.base64 ]; then
            echo "Source archive already published"
            exit 0
          fi
          base64 --decode .forgeapply-source.tar.xz.base64 > /tmp/forgeapply.tar.xz
          tar -tJf /tmp/forgeapply.tar.xz | head -n 30
          tar -xJf /tmp/forgeapply.tar.xz -C .
          test -f README.md
          test -f requirements.txt
          test -f forgeapply/app.py
          rm .forgeapply-source.tar.xz.base64
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          python -m pytest -q
      - name: Commit source onto the existing default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "feat: publish tested ForgeApply application"
            git push origin HEAD:master
          fi
