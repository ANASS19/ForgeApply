<!doctype html><html lang="en"><meta charset="utf-8"><title>Workday-style local practice</title>
<style>body{font:15px Arial;background:#f3f4f6;color:#172437;max-width:850px;margin:30px auto;padding:20px}main{background:white;padding:30px}label{display:block;margin:12px 0}input,select,textarea,button{padding:9px;font:inherit}input:not([type=radio]):not([type=checkbox]),textarea{display:block;min-width:60%}fieldset,[data-automation-id^=workExperience-],[data-automation-id^=education-]{border:1px solid #ccd3df;padding:15px;margin:12px 0}[role=option]{padding:12px;cursor:pointer}nav{display:flex;gap:16px;margin:18px 0}[aria-current=step]{font-weight:bold;color:#325fbc}</style>
<main></main><script>
const it=new URLSearchParams(location.search).get('lang')==='it',actual=new URLSearchParams(location.search).get('actual')==='1';document.documentElement.lang=it?'it':'en';let recordCounter=16;
const t=(en,italian)=>it?italian:en;
let step=0,saves=0;const saved=[];
const stages=['My Information','My Experience','Application Questions','Voluntary Disclosures','Review'];
const italian=['Informazioni personali','Esperienze','Domande di candidatura','Dichiarazioni volontarie','Riepilogo'];
const input=(name,en,italian,required=true,type='text')=>`<label>${t(en,italian)}${required?'*':''}<input name="${name}" type="${type}" ${required?'required':''}></label>`;
const nav=()=>'<nav>'+stages.map((s,i)=>`<span ${i===step?'aria-current="step"':''}>${t(s,italian[i])}</span>`).join('')+'</nav>';
function select(button,value,list){if(button.tagName==='INPUT')button.value=value;else button.textContent=value;button.dataset.value=value;button.setAttribute('aria-expanded','false');document.querySelector('#'+list).hidden=true;}
function show(){
 let content='';
 if(step===0)content=`<label id="sourceLabel">${t('How Did You Hear About Us?','Come ci hai conosciuto?')}*</label><button type="button" aria-haspopup="listbox" aria-labelledby="sourceLabel" aria-required="true" aria-controls="sources" onclick="document.querySelector('#sources').hidden=false">${t('Select One','Seleziona')}</button><div role="listbox" id="sources" hidden><div role="option" onclick="select(document.querySelector('[aria-controls=sources]'),this.textContent,'sources')">Company careers site</div><div role="option">LinkedIn</div></div>
 <fieldset><legend>${t('Have you ever worked for Synthetic Employer?','Hai mai lavorato per Synthetic Employer?')}*</legend><label><input type="radio" name="previous" value="wd-yes" required>${t('Yes','Sì')}</label><label><input type="radio" name="previous" value="wd-no">No</label></fieldset>
 ${input('given','Given Name(s)','Nome')}${input('family','Family Name','Cognome')}${input('address','Address Line 1','Indirizzo riga 1')}${input('postal','Postal Code','CAP')}
 <label>${t('City','Città')}*<input name="city" role="combobox" aria-controls="cities" required oninput="searchCity(this)" onclick="searchCity(this)"></label><div id="cities" role="listbox" hidden></div>
 <label id="provinceLabel">${t('Province','Provincia')}*</label><button type="button" aria-haspopup="listbox" aria-labelledby="provinceLabel" aria-required="true" aria-controls="provinces" onclick="document.querySelector('#provinces').hidden=false">${t('Select One','Seleziona')}</button><div id="provinces" role="listbox" hidden><div role="option" onclick="select(document.querySelector('[aria-controls=provinces]'),this.textContent,'provinces')">Milano</div></div><div data-automation-id="formField-countryPhoneCode">Italy (+39)</div>${input('phone','Phone Number','Telefono')}`;
 if(step===1)content=`<section data-test-section="experience" data-automation-id="workExperienceSection"><h2>${t('Work Experience','Esperienza professionale')}</h2><div class="rows"></div><button data-automation-id="addButton" type="button" onclick="addRecord('experience')">${t('Add Another','Aggiungi')}</button></section><section data-test-section="education" data-automation-id="educationSection"><h2>${t('Education','Formazione')}</h2><div class="rows"></div><button data-automation-id="addButton" type="button" onclick="addRecord('education')">${t('Add','Aggiungi')}</button></section><section data-test-section="certifications" data-automation-id="certificationsSection"><h2>${t('Certifications','Certificazioni')}</h2><div class="rows"></div><button data-automation-id="addButton" type="button" onclick="addRecord('certifications')">${t('Add','Aggiungi')}</button></section><section data-test-section="languages" data-automation-id="languagesSection"><h2>${t('Languages','Lingue')}</h2><div class="rows"></div><button data-automation-id="addButton" type="button" onclick="addRecord('languages')">${t('Add','Aggiungi')}</button></section><section data-automation-id="formField-skills"><h2>${t('Skills','Competenze')}</h2><label>${t('Type to Add Skills','Aggiungi competenze')}<div data-automation-id="multiSelectContainer"><div id="skillChips"></div><input id="skills--skills" aria-controls="skillOptions" oninput="searchSkills(this)" onclick="searchSkills(this)"></div></label><div id="skillOptions" role="listbox" hidden></div></section><label>${t('Resume','Carica il CV')}*<input name="cv" type="file" required></label>`;
 if(step===2)content=`<label>${t('Cover letter','Lettera di motivazione')}*<textarea name="motivation" required></textarea></label>${input('python','Years of Python experience','Anni di esperienza con Python',true,'number')}`;
 if(step===3)content=`<label><input name="privacy" type="checkbox" required>${t('I agree to this privacy declaration','Accetto questa dichiarazione sulla privacy')}</label>`;
 if(step===4)content=`<p>${t('Review your application. Final submission is manual.','Controlla la candidatura. L\'invio finale è manuale.')}</p><button type="button" onclick="fetch('/submit',{method:'POST'})">${t('Submit application','Invia candidatura')}</button>`;
 document.querySelector('main').innerHTML='<h1>Workday-style synthetic application</h1><p>Local practice only. No employer receives this data.</p>'+nav()+`<h2>${t(stages[step],italian[step])}</h2><form onsubmit="event.preventDefault();advance()">${content}${step<4?`<button>${t('Save and Continue','Salva e continua')}</button>`:''}</form>`;
 if(step===0)document.querySelector('[name=phone]').addEventListener('input',e=>{if(/^\d{8,12}$/.test(e.target.value))e.target.removeAttribute('aria-invalid');});
 if(step===0&&it){const button=document.querySelector('[aria-controls=provinces]'),input=document.createElement('input');for(const a of button.attributes)input.setAttribute(a.name,a.value);input.type='text';input.readOnly=true;input.setAttribute('role','combobox');input.placeholder='Seleziona';button.replaceWith(input);}
 if(step===1){addRecord('experience');if(!actual)addRecord('education');if(actual){document.querySelectorAll('[data-test-section]').forEach(section=>section.removeAttribute('data-automation-id'));document.querySelectorAll('[data-automation-id=addButton]').forEach(button=>button.removeAttribute('data-automation-id'));}}
}
function searchCity(input){setTimeout(()=>{const list=document.querySelector('#cities');if(!list)return;list.hidden=false;list.innerHTML='<div role="option" onclick="chooseCity(this)">Milano</div>';},100);}
function chooseCity(option){const input=document.querySelector('[name=city]');input.value='Milano';input.removeAttribute('aria-invalid');option.parentElement.hidden=true;}
function searchSkills(input){const root=document.querySelector('#skillOptions');root.replaceChildren();for(const skill of ['Python','SQL'])if(skill.toLowerCase().includes(input.value.toLowerCase())){const option=document.createElement('div');option.setAttribute('role','option');option.textContent=skill;option.onclick=()=>{const chip=document.createElement('span');chip.dataset.automationId='selectedItem';chip.textContent=skill;document.querySelector('#skillChips').append(chip);input.value='';root.hidden=true;};root.append(option);}root.hidden=false;}
function addRecord(section){
 const root=document.querySelector(`[data-test-section=${section}] .rows`);
 const n=root.children.length+1,row=document.createElement('div'),prefix=(section==='experience'?'workExperience':section)+'-'+(actual?++recordCounter:n);row.dataset.testRow=prefix;if(!actual)row.dataset.automationId=prefix;
 const dates=direction=>actual?`<fieldset data-automation-id="formField-${direction}Date"><legend>${direction==='start'?t('From','Da'):t('To','A')}*</legend><label>${t('Month','Mese')}<input required name="${direction}_month${n}" id="${prefix}--${direction}Date-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" placeholder="MM" pattern="0[1-9]|1[0-2]"></label><label>${t('Year','Anno')}<input required name="${direction}_year${n}" id="${prefix}--${direction}Date-dateSectionYear-input" data-automation-id="dateSectionYear-input" placeholder="YYYY" pattern="[0-9]{4}"></label></fieldset>`:input((direction==='start'?'from':'to')+n,direction==='start'?'From Year':'To Year',direction==='start'?'Data inizio anno':'Data fine anno');
 row.innerHTML=section==='experience'?input('company'+n,'Company','Azienda')+input('title'+n,'Job Title','Ruolo')+`<label><input type="checkbox" name="currently${n}">${t('I currently work here','Attualmente lavoro qui')}</label>`+dates('start')+dates('end')+`<label>${t('Role Description','Descrizione del ruolo')}<textarea></textarea></label>`:
 section==='education'?input('school'+n,'School or University','Università')+`<label>${t('Degree','Titolo di studio')}*<select required><option value="">${t('Select One','Seleziona')}</option><option value="masters">Master's degree</option><option value="bachelors">Bachelor's degree</option></select></label>`+input('study'+n,'Field of Study','Corso di studi')+dates('start')+dates('end'):
 section==='languages'?`<label>${t('Language','Lingua')}*<select required><option value="">Choose</option><option value="en">English</option><option value="it">Italian</option></select></label><label>${t('Overall proficiency','Livello generale')}*<select required><option value="">Choose</option><option>Advanced / C1</option><option>Beginner</option></select></label>`:
 input('certification'+n,'Certification','Certificazione')+input('issuer'+n,'Issuing organization','Ente certificatore');
 if(actual){let unnamed=0;for(const field of row.querySelectorAll('input,textarea,select'))if(!field.id){let suffix=field.name||'value'+(++unnamed);if(/^company/.test(suffix))suffix='companyName';else if(/^title/.test(suffix))suffix='jobTitle';field.id=prefix+'--'+suffix;}}
 root.append(row);
}
function advance(){
 if(step===0&&(!document.querySelector('[aria-controls=sources]').dataset.value||!document.querySelector('[aria-controls=provinces]').dataset.value))return;
 saved.push(Object.fromEntries(new FormData(document.querySelector('form'))));saves++;step++;show();
}
show();
</script></html>
